<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155e52">
  <meta name="description" content="뉴스에서 발견하는 절세, 제도와 돈의 인사이트">
  <title>돈의 달인</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="feed-header">
    <div class="toolbar">
      <h1>돈의 달인<span class="brand-dot" aria-hidden="true"></span></h1>
      <div class="header-actions">
        <button id="search-toggle" class="icon-button" type="button" aria-label="검색창 열기" aria-expanded="false" aria-controls="search-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
        <button id="saved-toggle" class="icon-button" type="button" aria-label="저장한 기사만 보기" aria-pressed="false"><span aria-hidden="true">★</span><span id="saved-badge" class="badge" hidden>0</span></button>
        <button id="install-button" class="icon-button install-button" type="button" aria-label="앱 설치 또는 설치 방법"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg><span>설치</span></button>
      </div>
    </div>
    <div id="search-panel" class="search-panel" hidden><label class="sr-only" for="query">기사 검색</label><input id="query" type="search" placeholder="제목 · 돈 인사이트 · 기사 내용 검색" autocomplete="off"><button id="search-clear" type="button">지우기</button></div>
    <nav id="categories" class="chips" aria-label="기사 카테고리 필터"></nav>
    <nav id="authors" class="chips author-chips" aria-label="에세이 필자 필터" hidden></nav>
  </header>
  <main id="main" class="feed-main">
    <div class="feed-summary"><span id="feed-label">전체 기사</span><span id="count" aria-live="polite"></span></div>
    <p id="status" class="status" role="status">기사를 불러오는 중입니다…</p>
    <div id="feed" aria-label="날짜순 기사 피드"></div>
    <noscript>기사 피드를 보려면 JavaScript를 켜 주세요.</noscript>
  </main>
  <footer class="disclaimer">교육·정보 목적이며 투자·세무 자문이 아닙니다. 세법은 수시로 바뀌니 시행 전 국세청·전문가로 확인하세요.</footer>
  <dialog id="detail-sheet" class="detail-sheet" aria-labelledby="detail-title">
    <div id="detail-toolbar" class="detail-toolbar"><button id="detail-back" class="back-button" type="button" aria-label="기사 닫기">← <span>뒤로</span></button><span class="sheet-handle" aria-hidden="true"></span><button id="detail-save" class="icon-button" type="button" aria-label="기사 저장" aria-pressed="false">☆</button></div>
    <div id="detail-scroll" class="detail-scroll"><article id="detail-content" class="detail-content"></article></div>
  </dialog>
  <dialog id="install-sheet" class="install-sheet" aria-labelledby="install-title">
    <h2 id="install-title">홈 화면에 돈의 달인</h2>
    <p>Android에서는 브라우저 메뉴 <strong>⋮ → 앱 설치 / 홈 화면에 추가</strong>를 선택하세요.</p>
    <p>iPhone·iPad에서는 Safari의 <strong>공유 → 홈 화면에 추가</strong>를 선택하세요.</p>
    <p>컴퓨터에서는 주소창의 설치 아이콘이나 브라우저 메뉴를 확인하세요. 설치 메뉴가 없다면 이 브라우저에서 웹으로 이용할 수 있습니다.</p>
    <form method="dialog"><button class="primary-button" type="submit">확인</button></form>
  </dialog>
</body>
</html>
