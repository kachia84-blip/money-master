<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155e52">
  <meta name="description" content="제도와 구조로 배우는 돈의 인사이트">
  <title>돈의 달인</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="masthead"><a href="./" class="brand">돈의 달인<span>제도 너머, 돈의 원리</span></a><div class="header-actions"><button type="button" id="install-button" class="install-button" hidden>설치 방법</button><span class="brand-mark" aria-hidden="true">₩</span></div></header>
  <main id="main">
    <section class="intro"><p class="eyebrow">매일 넓어지는 돈의 시야</p><h1 id="view-title">오늘의 인사이트</h1><p id="status" role="status" aria-live="polite">인사이트를 불러오고 있습니다.</p></section>
    <section id="daily-section" aria-labelledby="daily-title"><h2 id="daily-title">오늘의 한 장 <span id="today"></span></h2><div id="daily"></div></section>
    <section class="browse" aria-label="인사이트 찾기">
      <label for="query">인사이트 검색</label><input id="query" type="search" placeholder="제목, 요약, 나라로 검색" autocomplete="off">
      <div id="categories" class="categories" role="group" aria-label="카테고리"></div>
      <p id="count" class="count" aria-live="polite"></p><div id="cards" class="cards"></div>
    </section>
    <noscript>인사이트를 보려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
  </main>
  <footer class="fixed-footer"><p class="disclaimer">교육·정보 목적이며 투자·세무 자문이 아닙니다. 세법은 수시로 바뀌니 시행 전 국세청·전문가로 확인하세요.</p><nav class="bottom-nav" aria-label="하단 메뉴">
    <button type="button" data-view="home" aria-label="홈" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span class="nav-label">홈</span></button>
    <button type="button" data-view="search" aria-label="검색"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg><span class="nav-label">검색</span></button>
    <button type="button" data-view="saved" aria-label="저장"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg><span class="nav-label">저장</span><span id="saved-badge" class="nav-badge" aria-hidden="true" hidden>0</span></button>
  </nav></footer>
  <dialog id="install-sheet" class="install-sheet" aria-labelledby="install-title" aria-describedby="install-help"><h2 id="install-title">홈 화면에서 만나요</h2><p id="install-help">브라우저 메뉴(⋮ 또는 ≡) → <strong>홈 화면에 추가 / 앱 설치</strong>를 선택하세요.</p><p class="install-note">iPhone·iPad의 Safari에서는 공유 버튼 → 홈 화면에 추가를 선택하세요.</p><form method="dialog"><button class="sheet-close">확인</button></form></dialog>
</body>
</html>
